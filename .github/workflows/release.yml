name: Release

# Num push na main com versão nova no pubspec.yaml (ex.: 1.2.1+4): roda o CI, publica o .aab
# na Play Store (internal) e cria a tag v1.2.1 e a Release no GitHub com um .apk por arquitetura.
# Se a tag da versão já existir, nada é publicado.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

# Nunca cancela uma release em andamento.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      build: false

  version:
    name: Verificar versão nova
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comparar pubspec.yaml com as tags
        id: check
        run: |
          version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          tag="v${version%%+*}"
          build="${version#*+}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A tag $tag já existe; nada para publicar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Versão nova: $tag (build $build)." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Publicar ${{ needs.version.outputs.tag }} (Play Store e GitHub)
    needs: [ci, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      BUILD: ${{ needs.version.outputs.build }}
      AAB: build/app/outputs/bundle/release/app-release.aab
      APK_DIR: build/app/outputs/flutter-apk
    steps:
      # Falha logo no início, antes de instalar e compilar, se faltar algum secret.
      - name: Conferir secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS PLAY_STORE_JSON_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error title=Secret ausente::$name não está configurado. Cadastre em Settings → Environments → production (ou em Settings → Secrets and variables → Actions)."
            done
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'

      - name: Configurar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          # Confere a senha e o alias agora, em vez de deixar o erro aparecer no fim do build.
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Keystore inválido::O KEYSTORE_BASE64 não abre com o KEYSTORE_PASSWORD e o KEY_ALIAS cadastrados."
            exit 1
          fi

      - name: Gerar App Bundle assinado (Play Store)
        run: flutter build appbundle --release

      # Um APK por arquitetura (~20 MB cada) em vez de um único com as três (~55 MB).
      - name: Gerar APKs assinados por arquitetura (Release do GitHub)
        run: flutter build apk --release --split-per-abi

      - name: Guardar App Bundle e APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-${{ env.TAG }}
          path: |
            ${{ env.AAB }}
            ${{ env.APK_DIR }}/app-*-release.apk
          retention-days: 30

      - name: Enviar para a Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: br.com.rodrigosdk.realcalc
          releaseFiles: ${{ env.AAB }}
          releaseName: ${{ env.TAG }} (${{ env.BUILD }})
          track: internal
          status: completed

      # A tag só é criada depois do envio: se a Play Store falhar, basta rodar de novo.
      - name: Criar tag e Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # real_calc-v1.2.1-arm64-v8a.apk, real_calc-v1.2.1-armeabi-v7a.apk, real_calc-v1.2.1-x86_64.apk
          apks=()
          for apk in "$APK_DIR"/app-*-release.apk; do
            abi="$(basename "$apk" -release.apk)"
            abi="${abi#app-}"
            cp "$apk" "real_calc-$TAG-$abi.apk"
            apks+=("real_calc-$TAG-$abi.apk")
          done
          gh release create "$TAG" "${apks[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TAG (build $BUILD)" \
            --generate-notes \
            --notes "Qual APK baixar: \`arm64-v8a\` serve para quase todos os celulares atuais; \`armeabi-v7a\` para aparelhos antigos de 32 bits; \`x86_64\` para emuladores e Chromebooks." \
            --latest

      - name: Apagar credenciais
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
