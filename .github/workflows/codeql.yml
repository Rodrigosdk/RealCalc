name: CodeQL

# Análise de segurança do GitHub nos próprios workflows: injeção de comando, permissões
# excessivas, uso de secrets e actions de terceiros. Os alertas aparecem em Security → Code scanning.
#
# O CodeQL não suporta Dart. O Kotlin do Android ficou de fora porque exige um build
# completo a cada análise, e o único arquivo é o MainActivity.kt vazio gerado pelo Flutter.
on:
  push:
    branches: [main, develop]
    paths: &codeql_paths
      - '.github/**'
  pull_request:
    branches: [main, develop]
    paths: *codeql_paths
  schedule:
    # Toda quarta às 6h (Brasília), para pegar regras novas mesmo sem mudanças no código.
    - cron: '0 9 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analisar workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Iniciar CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
          queries: security-and-quality

      - name: Analisar
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:actions
