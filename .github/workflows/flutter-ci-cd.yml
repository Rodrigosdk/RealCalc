name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  deploy_production:
    name: Deploy to Play Store
    needs: analyze_and_test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Reconstruir o keystore a partir do Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Criar key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Criar credencial do Play Store
        run: |
          echo '${{ secrets.PLAY_STORE_JSON_KEY }}' > android/fastlane/play-store-credentials.json

      - run: flutter pub get

      - name: Build do App Bundle assinado
        run: flutter build appbundle --release

      - name: Instalar Fastlane
        run: |
          cd android
          bundle install

      - name: Deploy via Fastlane
        run: |
          cd android
          bundle exec fastlane deploy
